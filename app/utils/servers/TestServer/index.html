<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TestServer — Wolfkit Server</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 50%, #16213e 100%);
            color: #e0e0e0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            padding: 3rem;
            border: 1px solid rgba(15, 188, 249, 0.3);
            border-radius: 16px;
            background: rgba(30, 30, 45, 0.8);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 40px rgba(15, 188, 249, 0.15);
        }
        h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #0fbcf9, #00e676);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }
        p { color: #8c8da5; font-size: 1.1rem; }
        .badge {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.5rem 1.5rem;
            border: 1px solid #00e676;
            border-radius: 20px;
            color: #00e676;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ TestServer</h1>
        <p>Servidor Wolfkit funcionando correctamente</p>
        <div class="badge">🔒 Protegido por Wolfkit Security</div>
    </div>
</body>
</html>
